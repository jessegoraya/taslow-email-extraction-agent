name: taslow-email-extraction-agent

services:
  taslow-email-extraction:
    project: .
    host: azure.ai.agent
    language: python
    kind: hosted
    name: taslow-email-extraction
    description: Extracts structured Taslow task candidates from email payloads.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    container:
      resources:
        cpu: "1"
        memory: 2Gi
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: AZURE_OPENAI_ENDPOINT
        value: ${AZURE_OPENAI_ENDPOINT}
      - name: AZURE_OPENAI_AUTH_MODE
        value: entra
      - name: AGENT_TASK_EXTRACTOR_FALLBACK_ENABLED
        value: "false"
      - name: AGENT_PROJECT_SEARCH_PROVIDER
        value: azure-ai-search
      - name: AZURE_SEARCH_ENDPOINT
        value: ${AZURE_SEARCH_ENDPOINT}
      - name: AZURE_SEARCH_INDEX_NAME
        value: ${AZURE_SEARCH_INDEX_NAME}
      - name: PROJECT_SERVICE_BASE_URL
        value: ${PROJECT_SERVICE_BASE_URL}
      - name: PROJECT_SERVICE_TOKEN_SCOPE
        value: ${PROJECT_SERVICE_TOKEN_SCOPE}
    protocols:
      - protocol: invocations
        version: 1.0.0
