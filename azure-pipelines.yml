name: email-agent-ci-$(Date:yyyyMMdd).$(Rev:r)

trigger:
  batch: true
  branches:
    include:
      - main

pr:
  autoCancel: true
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.13'
    displayName: Use Python 3.13

  - script: python -m pip install --upgrade pip "setuptools>=83" wheel
    displayName: Upgrade Python build tools

  - script: python -m pip install -e .[dev]
    displayName: Install agent and test dependencies

  - script: python -m pip check
    displayName: Verify runtime dependency integrity

  - script: python -m ruff check .
    displayName: Lint agent source

  - script: >-
      python -m pytest
      --junitxml=$(Agent.TempDirectory)/agent-tests.xml
      --cov=taslow_email_extraction_agent
      --cov-report=xml:$(Agent.TempDirectory)/agent-coverage.xml
    displayName: Run agent tests and coverage

  - task: PublishTestResults@2
    displayName: Publish email extraction agent test results
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '$(Agent.TempDirectory)/agent-tests.xml'
      testRunTitle: 'Taslow | Component | Email Agent | Unit and Evaluation'
      failTaskOnFailedTests: true
      failTaskOnFailureToPublishResults: true
      failTaskOnMissingResultsFile: true
      publishRunAttachments: true

  - task: PublishCodeCoverageResults@2
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: '$(Agent.TempDirectory)/agent-coverage.xml'
      failIfCoverageEmpty: true

  - script: python -m pip_audit --skip-editable
    displayName: Audit Python dependencies

  - script: python -m build
    displayName: Build wheel and source distribution
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  - script: |
      python - <<'PY'
      from pathlib import Path
      import zipfile

      wheel_path = next(Path("dist").glob("taslow_email_extraction_agent-*.whl"))
      with zipfile.ZipFile(wheel_path) as wheel:
          metadata_path = next(
              name for name in wheel.namelist() if name.endswith(".dist-info/METADATA")
          )
          metadata = wheel.read(metadata_path).decode("utf-8")

      runtime_agent_framework = [
          line
          for line in metadata.splitlines()
          if line.startswith("Requires-Dist: agent-framework") and "extra ==" not in line
      ]
      if runtime_agent_framework:
          raise SystemExit(
              "Foundry runtime must not include Agent Framework dependencies: "
              + ", ".join(runtime_agent_framework)
          )
      print("Foundry hosted-runtime wheel metadata is free of Inspector-only dependencies.")
      PY
    displayName: Verify Foundry hosted-runtime wheel metadata
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $sourceArchive = 'dist/foundry-hosted-agent-source.zip'
      git archive --format=zip --output $sourceArchive "$(Build.SourceVersion)"
      if ($LASTEXITCODE -ne 0) { throw 'Unable to create the immutable hosted-agent source archive.' }
    displayName: Create immutable Foundry hosted-agent source archive
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  - pwsh: |
      Copy-Item RELEASE_NOTES.md dist
      $files = Get-ChildItem dist -File | Where-Object Name -ne artifact-manifest.json | ForEach-Object {
        [ordered]@{
          name = $_.Name
          sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          sizeBytes = $_.Length
        }
      }
      [ordered]@{
        schemaVersion = "1.0"
        component = "taslow-email-extraction-agent"
        repository = "jessegoraya/taslow-email-extraction-agent"
        sourceCommit = "$(Build.SourceVersion)"
        buildId = "$(Build.BuildId)"
        deploymentProtocol = "foundry-invocations-direct-code"
        deploymentSource = "foundry-hosted-agent-source.zip"
        files = @($files)
      } | ConvertTo-Json -Depth 6 | Set-Content dist/artifact-manifest.json
    displayName: Generate immutable agent artifact manifest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  - task: PublishPipelineArtifact@1
    displayName: Publish immutable agent artifact
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    inputs:
      targetPath: dist
      artifact: email-extraction-agent
